<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--light);
    color:var(--darkgreen);
    padding:16px;
}

.container{
    max-width:700px;
    margin:0 auto;
}

h1{
    text-align:center;
    color:var(--darkgreen);
    margin-bottom:10px;
    font-size:2rem;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    font-size:1rem;
}

#bingoBanner{
    display:none;
    background:var(--blue);
    color:white;
    padding:16px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    font-size:1.4rem;
    margin-bottom:20px;
    animation:pulse .9s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.03);
    }
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:10px;
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:700;
    font-size:.82rem;
    padding:8px;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue) !important;
    color:white !important;
    border-color:var(--blue) !important;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .square{
        min-height:70px;
        font-size:.72rem;
        padding:6px;
    }

    h1{
        font-size:1.6rem;
    }
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    pointer-events:none;
    animation:fall 3.5s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-20px) rotate(0deg);
    }

    to{
        transform:translateY(120vh) rotate(900deg);
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>Economic Regulation Bingo</h1>

    <p class="subtitle">
        Tap an acronym when it is mentioned.
    </p>

    <div id="bingoBanner">
        🎉 BINGO! 🎉
    </div>

    <div id="board" class="board"></div>

</div>

<script>

const STORAGE_KEY = "economic-regulation-bingo";

const acronyms = [...new Set([

"GN26",
"WAPC",
"EN29",
"FTA",
"GNT",
"PTRM",
"WACC",
"STPIS",
"NEM",
"AEMO",
"DNSP",
"AIO",
"CESS",
"NER",
"DMIS",
"RAB",
"EBSS",
"RFM",
"NGR",
"ECRC",
"CCP",
"NZ45",
"OPEX",
"CAPEX",
"CAB",
"ENA",
"IEP",
"NGL",
"NGO",
"RIN",
"TVM",
"RSA",
"RSP",
"SAIDI",
"NEO",
"TSS",
"SAIFI",
"EFM",
"F&A",
"CAM",
"CPI",
"ESOO",
"FOC",
"ICRC",
"DMO",
"SSO",
"UNFT"

])];

let alreadyCelebrated = false;

function shuffle(array){

    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}

function createCard(){

    const guaranteedRow = [
        "GN26",
        "WAPC",
        "EN29",
        "FTA",
        "GNT"
    ];

    const remaining = acronyms.filter(
        item => !guaranteedRow.includes(item)
    );

    const random = shuffle(remaining);

    const card = [

        ...random.slice(0,5),
        ...random.slice(5,10),

        ...guaranteedRow,

        ...random.slice(10,15),
        ...random.slice(15,20)

    ];

    const data = {
        card,
        selected: Array(25).fill(false)
    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    return data;
}

function getSavedGame(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        return JSON.parse(saved);

    }

    return createCard();
}

function saveState(){

    const game = getSavedGame();

    game.selected = [...document.querySelectorAll(".square")]
        .map(
            square =>
            square.classList.contains("selected")
        );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(game)
    );
}

function renderBoard(){

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    const game = getSavedGame();

    game.card.forEach((acronym,index)=>{

        const square =
            document.createElement("div");

        square.className = "square";

        square.textContent = acronym;

        if(game.selected[index]){

            square.classList.add("selected");
        }

        square.addEventListener("click",()=>{

            square.classList.toggle("selected");

            saveState();

            checkBingo();

        });

        board.appendChild(square);

    });

    checkBingo();
}

function getWinningLines(){

    const lines=[];

    for(let row=0;row<5;row++){

        lines.push([
            row*5,
            row*5+1,
            row*5+2,
            row*5+3,
            row*5+4
        ]);
    }

    for(let col=0;col<5;col++){

        lines.push([
            col,
            col+5,
            col+10,
            col+15,
            col+20
        ]);
    }

    lines.push([0,6,12,18,24]);
    lines.push([4,8,12,16,20]);

    return lines;
}

function checkBingo(){

    const banner =
        document.getElementById("bingoBanner");

    const squares =
        [...document.querySelectorAll(".square")];

    squares.forEach(
        square =>
        square.classList.remove("winning")
    );

    const selected =
        squares.map(
            square =>
            square.classList.contains("selected")
        );

    let winningLine = null;

    const lines = getWinningLines();

    for(const line of lines){

        if(line.every(
            index => selected[index]
        )){

            winningLine = line;

            break;
        }
    }

    if(winningLine){

        banner.style.display = "block";

        winningLine.forEach(index=>{

            squares[index]
                .classList
                .add("winning");

        });

        if(!alreadyCelebrated){

            launchConfetti();

            alreadyCelebrated = true;
        }

    }else{

        banner.style.display = "none";

        alreadyCelebrated = false;
    }
}

function launchConfetti(){

    const colours = [
        "#11873D",
        "#064D42",
        "#0032A0",
        "#E5E1E6"
    ];

    for(let i=0;i<100;i++){

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
            Math.random()*100 + "vw";

        piece.style.background =
            colours[
                Math.floor(
                    Math.random() *
                    colours.length
                )
            ];

        piece.style.animationDuration =
            (2 + Math.random()*2) + "s";

        document.body.appendChild(piece);

        setTimeout(
            ()=>piece.remove(),
            4500
        );
    }
}

renderBoard();

</script>

</body>
</html>
