<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--light);
    color:var(--darkgreen);
    padding:16px;
}

.container{
    max-width:700px;
    margin:0 auto;
}

h1{
    text-align:center;
    color:var(--darkgreen);
    margin-bottom:10px;
    font-size:2rem;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    font-size:1rem;
}

#bingoBanner{
    display:none;
    background:var(--blue);
    color:white;
    padding:16px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    font-size:1.4rem;
    margin-bottom:20px;
    animation:pulse .9s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.03);
    }
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:10px;
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:700;
    font-size:.82rem;
    padding:8px;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue) !important;
    color:white !important;
    border-color:var(--blue) !important;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .square{
        min-height:70px;
        font-size:.72rem;
        padding:6px;
    }

    h1{
        font-size:1.6rem;
    }
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    pointer-events:none;
    animation:fall 3.5s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-20px) rotate(0deg);
    }

    to{
        transform:translateY(120vh) rotate(900deg);
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>Economic Regulation Bingo</h1>

    <p class="subtitle">
        Tap an acronym when it is mentioned.
    </p>

    <div id="bingoBanner">
        🎉 BINGO! 🎉
    </div>

    <div id="board" class="board"></div>

</div>
