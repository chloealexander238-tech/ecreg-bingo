<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--light);
    color:var(--darkgreen);
    padding:10px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:var(--darkgreen);
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
}

#banner{
    display:none;
    text-align:center;
    background:var(--blue);
    color:white;
    font-size:1.5rem;
    font-weight:bold;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.board{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:10px;
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    transition:.2s;
    padding:6px;
    word-break:break-word;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue)!important;
    border-color:var(--blue)!important;
    color:white!important;
}

@media(max-width:600px){

    .square{
        min-height:65px;
        font-size:.7rem;
    }

    h1{
        font-size:1.5rem;
    }
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    pointer-events:none;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-20px) rotate(0deg);
    }

    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="container">

<h1>Economic Regulation Bingo</h1>

Tap acronyms as they are announced. Complete a row, column or diagonal to win.
</p>

<div id="board" class="board"></div>

</div>
