<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
    --white:#FFFFFF;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--light);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--darkgreen);
}

.container{
    max-width:700px;
    margin:0 auto;
    padding:16px;
}

h1{
    text-align:center;
    color:var(--darkgreen);
    margin-bottom:8px;
    font-size:1.8rem;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    font-size:1rem;
}

#bingoMessage{
    display:none;
    background:var(--blue);
    color:white;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    font-size:1.2rem;
    margin-bottom:15px;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.03)}
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:12px;
    min-height:80px;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    word-break:break-word;
    font-size:0.85rem;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue) !important;
    border-color:var(--blue) !important;
    color:white !important;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:0.85rem;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    pointer-events:none;
    top:-10px;
    animation:fall 4s linear forwards;
}

    from{
        transform:translateY(-10px) rotate(0deg);
    }
