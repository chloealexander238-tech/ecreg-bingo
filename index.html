function shuffle(array){

    let working = [...array];

    for(let i = working.length - 1; i > 0; i--){

        let j = Math.floor(
            Math.random() * (i + 1)
        );

        let temp = working[i];
        working[i] = working[j];
        working[j] = temp;
    }

    return working;
}

function buildCard(){

    const extras =
        shuffle(extraTerms)
        .slice(0,20);

    const cardTerms = shuffle([
        ...requiredTerms,
        ...extras

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    cardTerms.forEach(term => {

            document.createElement("div");

        square.textContent = term;

            "click",
            function(){

                square.classList.toggle(
                    "selected"
                );

                checkBingo();
            }
        );

        board.appendChild(square);

    });

}
