<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Economic Regulation Bingo</title>

<style>

:root {
    --green: #11873D;
    --dark-green: #064D42;
    --blue: #0032A0;
    --light: #E5E1E6;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: var(--light);
    color: var(--dark-green);
    padding: 12px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    color: var(--dark-green);
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
}

#bingoBanner {
    display: none;
    text-align: center;
    background: var(--blue);
    color: white;
    padding: 16px;
    border-radius: 12px;
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 16px;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

.board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.square {
    background: white;
    border: 2px solid var(--dark-green);
    border-radius: 10px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: .2s;
    word-break: break-word;
    font-size: 0.85rem;
}

.square.selected {
    background: var(--green);
    color: white;
    border-color: var(--green);
}

.square.winning {
    background: var(--blue) !important;
    border-color: var(--blue) !important;
    color: white !important;
}

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .square {
        min-height: 68px;
        font-size: 0.7rem;
    }

    h1 {
        font-size: 1.6rem;
    }
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    pointer-events: none;
    animation: fall 4s linear forwards;
}

@keyframes fall {
    from {
        transform: translateY(-20px) rotate(0deg);
    }
    to {
        transform: translateY(120vh) rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>Economic Regulation Bingo</h1>

    <p class="subtitle">
        Mark off acronyms as they are discussed.<br>
        Complete a row, column or diagonal to get Bingo.
    </p>

    <div id="bingoBanner">
        🎉 BINGO! 🎉
    </div>

    <div id="board" class="board"></div>

</div>
