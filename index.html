<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Economic Regulation Bingo</title>

<style>

:root{
--green:#11873D;
--darkgreen:#064D42;
--blue:#0032A0;
--light:#E5E1E6;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:var(--light);
padding:12px;
color:var(--darkgreen);
}

h1{
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
margin-bottom:16px;
line-height:1.4;
}

#banner{
display:none;
background:var(--blue);
color:white;
padding:16px;
border-radius:10px;
text-align:center;
font-size:1.3rem;
font-weight:bold;
margin-bottom:15px;
}

.board{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
max-width:800px;
margin:auto;
}

.square{
background:white;
border:2px solid var(--darkgreen);
border-radius:10px;
min-height:75px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:6px;
font-weight:bold;
cursor:pointer;
user-select:none;
transition:.2s;
}

.square.selected{
background:var(--green);
color:white;
border-color:var(--green);
}

.square.winning{
background:var(--blue)!important;
color:white!important;
border-color:var(--blue)!important;
}

@media(max-width:600px){

.square{
min-height:65px;
font-size:.72rem;
}

}

.confetti{
position:fixed;
pointer-events:none;
z-index:9999;
}

@keyframes cannonLeft{
0%{
transform:translate(0,0) rotate(0deg);
opacity:1;
}
100%{
transform:
translate(
calc(300px + var(--drift) * 400px),
calc(-250px + var(--drop) * 700px)
)
rotate(1080deg);
opacity:0;
}
}

@keyframes cannonRight{
0%{
transform:translate(0,0) rotate(0deg);
opacity:1;
}
100%{
transform:
translate(
calc(-300px - var(--drift) * 400px),
calc(-250px + var(--drop) * 700px)
)
rotate(-1080deg);
opacity:0;
}
}

</style>
</head>
<body>

<h1>Economic Regulation Bingo</h1>

<p class="subtitle">
Complete a row, column or diagonal.<br>
⭐ Strategic Bingo: mark GN26, WAPC, EN29, FTA and GNT.
</p>

<div id="banner"></div>

<div id="board" class="board"></div>

<script>

const REQUIRED = [
"GN26",
"WAPC",
"EN29",
"FTA",
"GNT"
];

const OPTIONAL = [
"PTRM",
"WACC",
"STPIS",
"NEM",
"AEMO",
"DNSP",
"AIO",
"CESS",
"NER",
"DMIS",
"RAB",
"EBSS",
"RFM",
"NGR",
"ECRC",
"CCP",
"NZ45",
"OPEX",
"CAPEX",
"CAB",
"ENA",
"IEP",
"NGL",
"NGO",
"RIN",
"TVM",
"RSA",
"RSP",
"SAIDI",
"NEO",
"TSS",
"SAIFI",
"EFM",
"F&A",
"CAM",
"CPI",
"ESOO",
"FOC",
"ICRC",
"DMO",
"SSO",
"UNFT"
];

let celebrated = false;

function shuffle(arr){

const a=[...arr];

for(let i=a.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[a[i],a[j]]=[a[j],a[i]];
}

return a;
}

const extras =
shuffle(OPTIONAL).slice(0,20);

const card =
shuffle([
...REQUIRED,
...extras
]);

const board =
document.getElementById("board");

card.forEach(term=>{

const square =
document.createElement("div");

square.className="square";
square.textContent=term;

square.onclick=()=>{
square.classList.toggle("selected");
checkBingo();
};

board.appendChild(square);

});

function checkBingo(){

const squares =
[...document.querySelectorAll(".square")];

squares.forEach(s=>
s.classList.remove("winning")
);

const selected =
squares.map(square =>
square.classList.contains("selected")
);

const lines=[];

for(let r=0;r<5;r++){

lines.push([
r*5,
r*5+1,
r*5+2,
r*5+3,
r*5+4
]);
}

for(let c=0;c<5;c++){

lines.push([
c,
c+5,
c+10,
c+15,
c+20
]);
}

lines.push([0,6,12,18,24]);
lines.push([4,8,12,16,20]);

let bingoLine=null;

for(const line of lines){

if(line.every(i=>selected[i])){

bingoLine=line;
break;
}
}

const selectedTerms =
squares
.filter(s=>s.classList.contains("selected"))
.map(s=>s.textContent);

const strategicWin =
REQUIRED.every(term =>
selectedTerms.includes(term)
);

const banner =
document.getElementById("banner");

if(bingoLine){

banner.style.display="block";
banner.innerHTML="🎉 BINGO! 🎉";

bingoLine.forEach(i=>{
squares[i].classList.add("winning");
});

if(!celebrated){

launchConfetti();
celebrated=true;

}

return;
}

if(strategicWin){

banner.style.display="block";
banner.innerHTML="⭐ STRATEGIC BINGO! ⭐";

if(!celebrated){

launchConfetti();
celebrated=true;

}

return;
}

banner.style.display="none";
celebrated=false;

}

function launchConfetti(){

const colours=[
"#11873D",
"#064D42",
"#0032A0",
"#FFFFFF"
];

for(let i=0;i<200;i++){

const piece =
document.createElement("div");

piece.className="confetti";

piece.style.width =
(6+Math.random()*10)+"px";

piece.style.height =
(8+Math.random()*16)+"px";

piece.style.background =
colours[
Math.floor(
Math.random()*colours.length
)
];

piece.style.setProperty(
"--drift",
Math.random()
);

piece.style.setProperty(
"--drop",
Math.random()
);

const duration =
2+Math.random()*2;

if(i%2===0){

piece.style.left="0px";
piece.style.bottom="0px";

piece.style.animation=
`cannonLeft ${duration}s ease-out forwards`;

}else{

piece.style.right="0px";
piece.style.bottom="0px";

piece.style.animation=
`cannonRight ${duration}s ease-out forwards`;

}

document.body.appendChild(piece);

setTimeout(()=>{
piece.remove();
},5000);

}

}

</script>

</body>
</html>
