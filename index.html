<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--light);
    font-family:Arial, sans-serif;
    color:var(--darkgreen);
    padding:12px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:var(--darkgreen);
    margin-bottom:8px;
    font-size:2rem;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    line-height:1.4;
}

#bingoBanner{
    display:none;
    background:var(--blue);
    color:white;
    text-align:center;
    padding:16px;
    border-radius:12px;
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:16px;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.03);}
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:10px;
    min-height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:700;
    padding:6px;
    cursor:pointer;
    transition:.2s;
    user-select:none;
    word-break:break-word;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue) !important;
    border-color:var(--blue) !important;
    color:white !important;
}

@media(max-width:600px){

    .square{
        min-height:68px;
        font-size:0.7rem;
    }

    h1{
        font-size:1.7rem;
    }

    .subtitle{
        font-size:0.9rem;
    }

}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    pointer-events:none;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-20px) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>Economic Regulation Bingo</h1>

    <p class="subtitle">
        Mark off acronyms as they are discussed.<br>
        Complete a row, column or diagonal to get Bingo.
    </p>

    <div id="bingoBanner">
        🎉 BINGO! 🎉
    </div>

    <div id="board" class="board"></div>

</div>

const TERMS = [

"GN26",

"FTA",

function shuffle(array){

    const arr = [...array];

    for(let i = arr.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}

function generateCard(){

    const data = {

        card: shuffle(TERMS),

        selected: new Array(25).fill(false)

    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    return data;
}

function getGame(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        return JSON.parse(saved);
    }

    return generateCard();
}

function saveGame(){

    const game = getGame();

    game.selected = [
        ...document.querySelectorAll(".square")
    ].map(square =>
        square.classList.contains("selected")
    );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(game)
    );
}

function renderBoard(){

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    const game = getGame();

    game.card.forEach((term,index)=>{

        const square =
            document.createElement("div");

        square.className = "square";

        square.innerText = term;

        if(game.selected[index]){

            square.classList.add("selected");
        }

        square.addEventListener("click",()=>{

            square.classList.toggle("selected");

            saveGame();

            checkForBingo();

        });

        board.appendChild(square);

    });

    checkForBingo();
}
