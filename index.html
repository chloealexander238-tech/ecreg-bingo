<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Economic Regulation Bingo</title>

<style>

:root{
    --green:#11873D;
    --darkgreen:#064D42;
    --blue:#0032A0;
    --light:#E5E1E6;
    --white:#FFFFFF;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--light);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--darkgreen);
}

.container{
    max-width:700px;
    margin:0 auto;
    padding:16px;
}

h1{
    text-align:center;
    color:var(--darkgreen);
    margin-bottom:8px;
    font-size:1.8rem;
}

.subtitle{
    text-align:center;
    margin-bottom:20px;
    font-size:1rem;
}

#bingoMessage{
    display:none;
    background:var(--blue);
    color:white;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    font-size:1.2rem;
    margin-bottom:15px;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.03)}
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.square{
    background:white;
    border:2px solid var(--darkgreen);
    border-radius:12px;
    min-height:80px;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    word-break:break-word;
    font-size:0.85rem;
}

.square.selected{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.square.winning{
    background:var(--blue) !important;
    border-color:var(--blue) !important;
    color:white !important;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:0.85rem;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    pointer-events:none;
    top:-10px;
    animation:fall 4s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-10px) rotate(0deg);
    }
    to{
        transform:translateY(120vh) rotate(720deg);
    }
}

</style>
</head>
<body>

<div class="container">

    <h1>Economic Regulation Bingo</h1>

    <p class="subtitle">
        Tap an acronym when you hear it or use it.
    </p>

    <div id="bingoMessage">
        🎉 BINGO! 🎉
    </div>

    <div class="board" id="board"></div>

</div>

<script>

const STORAGE_KEY = "econ-reg-bingo-v2";

const acronyms = [...new Set([
"GN26",
"WAPC",
"EN29",
"FTA",
"GNT",
"PTRM",
"WACC",
"STPIS",
"NEM",
"AEMO",
"DNSP",
"AIO",
"CESS",
"NER",
"DMIS",
"RAB",
"EBSS",
"RFM",
"NGR",
"ECRC",
"CCP",
"NZ45",
"OPEX",
"CAPEX",
"CAB",
"ENA",
"IEP",
"NGL",
"NGO",
"RIN",
"TVM",
"RSA",
"RSP",
"SAIDI",
"NEO",
"TSS",
"SAIFI",
"EFM",
"F&A",
"CAM",
"CPI",
"ESOO",
"FOC",
"ICRC",
"DMO",
"SSO",
"UNFT"
])];

let card = [];

function shuffle(array){

    let copy = [...array];

    for(let i=copy.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [copy[i],copy[j]]=[copy[j],copy[i]];
    }

    return copy;
}

function createCard(){

    const shuffled = shuffle(acronyms);

    card = shuffled.slice(0,25);

    const data={
        card,
        selected:Array(25).fill(false)
    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    return data;

}

function loadCard(){

    let data = localStorage.getItem(STORAGE_KEY);

    if(!data){

        return createCard();

    }

    return JSON.parse(data);

}

function saveSelections(){

    const squares = document.querySelectorAll('.square');

    const data = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    );

    data.selected = [...squares].map(
        s=>s.classList.contains('selected')
    );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}

function render(){

    const board = document.getElementById('board');

    board.innerHTML='';

    const data = loadCard();

    data.card.forEach((item,index)=>{

        const div=document.createElement('div');

        div.className='square';

        div.textContent=item;

        if(data.selected[index]){

            div.classList.add('selected');

        }

        div.addEventListener('click',()=>{

            div.classList.toggle('selected');

            saveSelections();

            checkBingo();

        });

        board.appendChild(div);

    });

    checkBingo();

}

function getWinningLines(){

    const lines=[];

    for(let r=0;r<5;r++){

        lines.push([
            r*5,
            r*5+1,
            r*5+2,
            r*5+3,
            r*5+4
        ]);

    }

    for(let c=0;c<5;c++){

        lines.push([
            c,
            c+5,
            c+10,
            c+15,
            c+20
        ]);

    }

    lines.push([0,6,12,18,24]);

    lines.push([4,8,12,16,20]);

    return lines;

}

let alreadyCelebrated = false;

function checkBingo(){

    const squares =
        [...document.querySelectorAll('.square')];

    squares.forEach(
        s=>s.classList.remove('winning')
    );

    const selected =
        squares.map(
            s=>s.classList.contains('selected')
        );

    const lines = getWinningLines();

    let winningLine=null;

    for(const line of lines){

        if(line.every(i=>selected[i])){

            winningLine=line;
            break;

        }

    }

    const banner =
        document.getElementById('bingoMessage');

    if(winningLine){

        banner.style.display='block';

        winningLine.forEach(i=>{
            squares[i].classList.add('winning');
        });

        if(!alreadyCelebrated){

            launchConfetti();

            alreadyCelebrated=true;

        }

    }else{

        banner.style.display='none';

        alreadyCelebrated=false;

    }

}

function launchConfetti(){

    const colours=[
        "#11873D",
        "#064D42",
        "#0032A0",
        "#E5E1E6"
    ];

    for(let i=0;i<120;i++){

        const confetti =
            document.createElement('div');

        confetti.className='confetti';

        confetti.style.left=
            Math.random()*100+"vw";

        confetti.style.background=
            colours[
                Math.floor(
                    Math.random()*colours.length
                )
            ];

        confetti.style.animationDuration=
            (2 + Math.random()*3) + "s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);

    }

}

render();

</script>

</body>
</html>
