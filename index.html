<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Economic Regulation Bingo</title>

<style>

:root{
  --green:#11873D;
  --darkgreen:#064D42;
  --blue:#0032A0;
  --light:#E5E1E6;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--darkgreen);
}

h1{
  text-align:center;
  margin-bottom:5px;
}

p{
  text-align:center;
  margin-bottom:20px;
}

#banner{
  display:none;
  background:var(--blue);
  color:white;
  text-align:center;
  padding:15px;
  border-radius:8px;
  font-size:1.4rem;
  font-weight:bold;
  margin-bottom:15px;
}

.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.square{
  background:white;
  border:2px solid var(--darkgreen);
  border-radius:8px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:6px;
  font-size:.8rem;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
}

.square.selected{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.square.winning{
  background:var(--blue) !important;
  color:white !important;
  border-color:var(--blue) !important;
}

@media(max-width:600px){

  .square{
    min-height:65px;
    font-size:.7rem;
  }

}

</style>
</head>

<body>

<h1>Economic Regulation Bingo</h1>

<p>Mark off acronyms as they are announced.</p>

<div id="banner">
🎉 BINGO! 🎉
</div>

<div id="board" class="board"></div>

<script>

const STORAGE_KEY = "econ-bingo-v1";

const mandatory = [
  "GN26",
  "WAPC",
  "EN29",
  "FTA",
  "GNT"
];

const optional = [

  "WACC",
  "STPIS",
  "NEM",
  "AEMO",
  "DNSP",
  "AIO",
  "CESS",
  "NER",

  "RAB",
  "EBSS",
  "RFM",
  "NGR",
  "ECRC",
  "CCP",
  "NZ45",
  "OPEX",
  "CAPEX",
  "CAB",

  "IEP",
  "NGL",
  "NGO",
  "RIN",
  "TVM",
  "RSA",
  "RSP",

  "NEO",

  "SAIFI",
  "EFM",
  "F&A",
  "CAM",
  "CPI",
  "ESOO",
  "FOC",
  "ICRC",
  "DMO",
  "SSO",
  "UNFT"
];

function shuffle(array){

  let arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){

    let j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

function createCard(){

  let extras = shuffle(optional).slice(0,20);

  let card = shuffle([
    ...mandatory,
    ...extras
  ]);

  let game = {
    card: card,
    selected: Array(25).fill(false)
  };

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(game)
  );

  return game;
}

function getGame(){

  let saved =
    localStorage.getItem(STORAGE_KEY);

  if(saved){
    return JSON.parse(saved);
  }

  return createCard();
}

function saveGame(){

  let game = getGame();

  game.selected = [...document.querySelectorAll(".square")]
    .map(square =>
      square.classList.contains("selected")
    );

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(game)
  );
}

function renderBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  let game = getGame();

  game.card.forEach((term,index)=>{

    let square =
      document.createElement("div");

    square.className = "square";
    square.textContent = term;

    if(game.selected[index]){
      square.classList.add("selected");
    }

    square.onclick = ()=>{

      square.classList.toggle("selected");

      saveGame();

      checkBingo();

    };

    board.appendChild(square);

  });

  checkBingo();
}
